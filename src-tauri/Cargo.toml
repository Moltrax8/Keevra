[package]
name = "keevra"
version = "0.2.6"
description = "A local-first, encrypted account directory for Windows."
edition = "2021"
license = "MIT"
repository = "https://github.com/Moltrax8/Keevra"
homepage = "https://github.com/Moltrax8/Keevra"

[lib]
# Keep the library name distinct from the Windows executable name.
name = "keevra_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
base64 = "0.23"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
mime_guess = "2.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
# ShellExecuteW opens the verified installer the same way Explorer does, so a
# setup that needs elevation still gets its UAC prompt.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Test and `tauri dev` builds only need to run, not to be debugged: dropping
# debuginfo and incremental state keeps `target/debug` small instead of
# letting it grow to many gigabytes. Debug assertions and overflow checks stay
# on, so tests behave exactly as before.
[profile.dev]
debug = 0
incremental = false
