name: Release

# Tag-only release pipeline (K-15).
#
# Builds the NSIS installer from the tagged source. If the Windows code-signing
# secrets are present, the installer is Authenticode-signed and verified before
# upload. If they are absent, the installer is published UNSIGNED with a
# checksum and a SmartScreen warning in the release notes. Either way, the
# download is covered by build-provenance and SBOM attestations.
#
# The update manifest is signed OFFLINE with the updater key and attached
# manually (see docs/RELEASE_SECURITY.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write      # release upload
      id-token: write      # build provenance attestation
      attestations: write  # Sigstore-backed attestations

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Check tag matches every version file
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG.TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          foreach ($pair in @(@("package.json", $pkg), @("Cargo.toml", $cargo), @("tauri.conf.json", $conf))) {
            if ($pair[1] -ne $tag) { throw "Tag $tag does not match $($pair[0]) version $($pair[1])" }
          }

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      # Audit the exact locked graph of the tagged commit. CI runs this on
      # main, but a tag can point at an unmerged commit, so the gate is
      # repeated here rather than inherited.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-audit

      - name: Rust advisory audit
        run: cargo audit --file src-tauri/Cargo.lock

      # Optional signing. Missing secrets are not fatal: the installer is then
      # published unsigned and the warning is recorded in the release notes.
      - name: Import code-signing certificate (optional)
        id: signing
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
            Write-Host "::warning title=Unsigned build::No code-signing certificate is configured. The installer will be published unsigned and SmartScreen will warn about an unknown publisher."
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "keevra-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          $secure = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfx -Force
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "keevra-signing.json") -Value $config -Encoding utf8
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build NSIS installer
        shell: pwsh
        run: |
          if ("${{ steps.signing.outputs.signed }}" -eq "true") {
            npx tauri build --bundles nsis --config "$env:RUNNER_TEMP\keevra-signing.json"
          } else {
            npx tauri build --bundles nsis
          }

      - name: Verify Authenticode signatures
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $targets = @(Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe")
          $targets += Get-Item "src-tauri\target\release\keevra.exe"
          foreach ($target in $targets) {
            & $signtool.FullName verify /pa /v $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($target.FullName)" }
          }

      - name: Collect release artifacts and SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $exe = Get-Item "src-tauri\target\release\keevra.exe"
          Copy-Item $installer.FullName release-artifacts
          Copy-Item $exe.FullName release-artifacts
          $installerHash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          $exeHash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          $sums = @(
            "{0}  {1}" -f $installerHash, $installer.Name
            "{0}  {1}" -f $exeHash, $exe.Name
          )
          Set-Content -Path "release-artifacts\SHA256SUMS.txt" -Value $sums -Encoding utf8
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Unsigned manifest input: the updater key lives offline, so the
          # maintainer signs this file out-of-band and uploads updates.json +
          # updates.json.minisig. Never publish this file as updates.json.
          $manifest = @{ version = $version; assets = @(@{ name = $installer.Name; sha256 = $installerHash }) } |
            ConvertTo-Json -Depth 5
          Set-Content -Path "release-artifacts\updates.unsigned.json" -Value $manifest -Encoding utf8

      - name: npm SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx > release-artifacts/keevra-npm-sbom.cdx.json

      - name: Rust SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: src-tauri
          format: cyclonedx-json
          output-file: release-artifacts/keevra-rust-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-artifacts/*

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/*
          sbom-path: release-artifacts/keevra-rust-sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keevra-release-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Compose release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lines = Get-Content CHANGELOG.md
          $heading = $lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1
          if (-not $heading) { throw "No CHANGELOG.md section for $version" }
          $trigger = $false
          $body = foreach ($line in $lines) {
            if (-not $trigger -and $line -match "^## \[$([regex]::Escape($version))\]") { $trigger = $true }
            elseif ($trigger -and $line -match '^## \[') { break }
            elseif ($trigger) { $line }
          }
          $header = if ("${{ steps.signing.outputs.signed }}" -eq "true") {
            "Draft. Before publishing: attach the offline-signed updates.json and updates.json.minisig, then verify the Authenticode signature and provenance attestation.`n`n"
          } else {
            "Unsigned build. Windows SmartScreen will warn that the publisher is unknown. Verify the installer against SHA256SUMS.txt and the build-provenance attestation before running it. See docs/RELEASE_SECURITY.md.`n`n"
          }
          Set-Content -Path release-notes.md -Value ($header + ($body -join "`n")) -Encoding utf8

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exists = gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            $draftArgs = @()
            if ("${{ steps.signing.outputs.signed }}" -eq "true") { $draftArgs += "--draft" }
            gh release create $env:GITHUB_REF_NAME @draftArgs `
              --title "Keevra $env:GITHUB_REF_NAME" --notes-file release-notes.md
          } else {
            gh release edit $env:GITHUB_REF_NAME --notes-file release-notes.md
          }
          $assets = @(Get-ChildItem release-artifacts -File | ForEach-Object { $_.FullName })
          gh release upload $env:GITHUB_REF_NAME $assets --clobber

      - name: Remove imported certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERT_THUMBPRINT) {
            Get-ChildItem "Cert:\CurrentUser\My\$env:WINDOWS_CERT_THUMBPRINT" -ErrorAction SilentlyContinue |
              Remove-Item -Force
          }
