name: Release

# Tag-only release pipeline (K-15).
#
# Builds the NSIS installer from the tagged source. If the Windows code-signing
# secrets are present, the installer is Authenticode-signed and verified before
# upload. If they are absent, the installer is published UNSIGNED with a
# checksum and a SmartScreen warning in the release notes. Either way, the
# download is covered by build-provenance and SBOM attestations.
#
# The update manifest is signed OFFLINE with the updater key and attached
# manually (see docs/RELEASE_SECURITY.md).
#
# Manual dispatch only: Actions minutes are not available for this repository,
# so tag pushes must not start a run that would immediately fail. Releases are
# built and published with tools/release-local.ps1. If Actions is available
# again, run the pipeline on a tag with:
#   gh workflow run release.yml --ref v0.2.5
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write      # release upload
      id-token: write      # build provenance attestation
      attestations: write  # Sigstore-backed attestations

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Check tag matches every version file
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG.TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          foreach ($pair in @(@("package.json", $pkg), @("Cargo.toml", $cargo), @("tauri.conf.json", $conf))) {
            if ($pair[1] -ne $tag) { throw "Tag $tag does not match $($pair[0]) version $($pair[1])" }
          }

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      # Audit the exact locked graph of the tagged commit. CI runs this on
      # main, but a tag can point at an unmerged commit, so the gate is
      # repeated here rather than inherited.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-audit

      - name: Rust advisory audit
        run: cargo audit --file src-tauri/Cargo.lock

      # Optional signing. Missing secrets are not fatal: the installer is then
      # published unsigned and the warning is recorded in the release notes.
      - name: Import code-signing certificate (optional)
        id: signing
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
            Write-Host "::warning title=Unsigned build::No code-signing certificate is configured. The installer will be published unsigned and SmartScreen will warn about an unknown publisher."
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "keevra-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          $secure = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfx -Force
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "keevra-signing.json") -Value $config -Encoding utf8
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Tauri's bundler downloads the NSIS toolset from GitHub release assets
      # through github.com's `/releases/download/...` redirect, which can return
      # transient 504s while the same bytes are still served by the asset API.
      # Seed the tool cache from the authoritative release via api.github.com so
      # the bundle step never depends on that redirect path.
      - name: Seed NSIS tool cache
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:LOCALAPPDATA "tauri"
          $nsis = Join-Path $root "NSIS"
          $dll = Join-Path $nsis "Plugins\x86-unicode\additional\nsis_tauri_utils.dll"
          if ((Test-Path (Join-Path $nsis "makensis.exe")) -and (Test-Path $dll)) {
            Write-Host "NSIS tool cache already present."
            exit 0
          }

          New-Item -ItemType Directory -Force $root | Out-Null

          function Save-ReleaseAsset {
            param([string]$Repo, [string]$Tag, [string]$Name, [string]$OutFile)
            $api = @{ Accept = "application/vnd.github+json"; Authorization = "Bearer $env:GITHUB_TOKEN" }
            $release = Invoke-RestMethod -Headers $api -Uri "https://api.github.com/repos/$Repo/releases/tags/$Tag"
            $asset = $release.assets | Where-Object { $_.name -eq $Name } | Select-Object -First 1
            if (-not $asset) { throw "asset $Name not found in $Repo@$Tag" }
            $download = @{ Accept = "application/octet-stream"; Authorization = "Bearer $env:GITHUB_TOKEN" }
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                Invoke-WebRequest -Headers $download -Uri $asset.url -OutFile $OutFile
                return
              } catch {
                if ($attempt -eq 5) { throw }
                Write-Host "attempt $attempt failed: $($_.Exception.Message)"
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }

          $temp = Join-Path $env:RUNNER_TEMP "nsis-seed"
          New-Item -ItemType Directory -Force $temp | Out-Null
          $zip = Join-Path $temp "nsis-3.11.zip"
          $dllDownload = Join-Path $temp "nsis_tauri_utils.dll"
          Save-ReleaseAsset -Repo "tauri-apps/binary-releases" -Tag "nsis-3.11" -Name "nsis-3.11.zip" -OutFile $zip
          Save-ReleaseAsset -Repo "tauri-apps/nsis-tauri-utils" -Tag "nsis_tauri_utils-v0.5.3" -Name "nsis_tauri_utils.dll" -OutFile $dllDownload

          $expanded = Join-Path $temp "expanded"
          Expand-Archive -Path $zip -DestinationPath $expanded -Force
          # The archive has one top-level folder; pick the shallowest makensis.exe
          # and copy that folder's contents, which is what Tauri expects.
          $makensis = Get-ChildItem $expanded -Recurse -Filter "makensis.exe" |
            Sort-Object { $_.FullName.Split([System.IO.Path]::DirectorySeparatorChar).Count } |
            Select-Object -First 1
          if (-not $makensis) { throw "makensis.exe not found in nsis-3.11.zip" }
          New-Item -ItemType Directory -Force $nsis | Out-Null
          Copy-Item -Path (Join-Path $makensis.Directory.FullName "*") -Destination $nsis -Recurse -Force
          New-Item -ItemType Directory -Force (Split-Path $dll) | Out-Null
          Copy-Item -Path $dllDownload -Destination $dll -Force
          Write-Host "Seeded NSIS tool cache at $nsis"

      - name: Build NSIS installer
        shell: pwsh
        run: |
          if ("${{ steps.signing.outputs.signed }}" -eq "true") {
            npx tauri build --bundles nsis --config "$env:RUNNER_TEMP\keevra-signing.json"
          } else {
            npx tauri build --bundles nsis
          }

      - name: Verify Authenticode signatures
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $targets = @(Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe")
          $targets += Get-Item "src-tauri\target\release\keevra.exe"
          foreach ($target in $targets) {
            & $signtool.FullName verify /pa /v $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($target.FullName)" }
          }

      - name: Collect release artifacts and SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $exe = Get-Item "src-tauri\target\release\keevra.exe"
          Copy-Item $installer.FullName release-artifacts
          Copy-Item $exe.FullName release-artifacts
          $installerHash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          $exeHash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          $sums = @(
            "{0}  {1}" -f $installerHash, $installer.Name
            "{0}  {1}" -f $exeHash, $exe.Name
          )
          Set-Content -Path "release-artifacts\SHA256SUMS.txt" -Value $sums -Encoding utf8
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Unsigned manifest input: the updater key lives offline, so the
          # maintainer signs this file out-of-band and uploads updates.json +
          # updates.json.minisig. Never publish this file as updates.json.
          $manifest = @{ version = $version; assets = @(@{ name = $installer.Name; sha256 = $installerHash }) } |
            ConvertTo-Json -Depth 5
          Set-Content -Path "release-artifacts\updates.unsigned.json" -Value $manifest -Encoding utf8

      - name: npm SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx > release-artifacts/keevra-npm-sbom.cdx.json

      - name: Rust SBOM (CycloneDX)
        shell: pwsh
        run: |
          # Generated from Cargo.lock through crates.io instead of downloading a
          # scanner binary from GitHub releases: that download path can return
          # 504 and block a tag build, while crates.io is independent of it.
          cargo install cargo-cyclonedx --version 0.5.10 --locked
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json
          $sbom = Get-ChildItem src-tauri -Filter "*.cdx.json" | Select-Object -First 1
          if (-not $sbom) { throw "cargo cyclonedx produced no SBOM" }
          Move-Item -Path $sbom.FullName -Destination "release-artifacts/keevra-rust-sbom.cdx.json" -Force

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/*
          sbom-path: release-artifacts/keevra-rust-sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keevra-release-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Compose release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lines = Get-Content CHANGELOG.md
          $heading = $lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1
          if (-not $heading) { throw "No CHANGELOG.md section for $version" }
          $trigger = $false
          $body = foreach ($line in $lines) {
            if (-not $trigger -and $line -match "^## \[$([regex]::Escape($version))\]") { $trigger = $true }
            elseif ($trigger -and $line -match '^## \[') { break }
            elseif ($trigger) { $line }
          }
          $header = if ("${{ steps.signing.outputs.signed }}" -eq "true") {
            "Draft. Before publishing: attach the offline-signed updates.json and updates.json.minisig, then verify the Authenticode signature and provenance attestation.`n`n"
          } else {
            "Unsigned build. Windows SmartScreen will warn that the publisher is unknown. Verify the installer against SHA256SUMS.txt and the build-provenance attestation before running it.`n`n"
          }
          Set-Content -Path release-notes.md -Value ($header + ($body -join "`n")) -Encoding utf8

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exists = gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            $draftArgs = @()
            if ("${{ steps.signing.outputs.signed }}" -eq "true") { $draftArgs += "--draft" }
            gh release create $env:GITHUB_REF_NAME @draftArgs `
              --title "Keevra $env:GITHUB_REF_NAME" --notes-file release-notes.md
          } else {
            gh release edit $env:GITHUB_REF_NAME --notes-file release-notes.md
          }
          $assets = @(Get-ChildItem release-artifacts -File | ForEach-Object { $_.FullName })
          gh release upload $env:GITHUB_REF_NAME $assets --clobber

      - name: Remove imported certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERT_THUMBPRINT) {
            Get-ChildItem "Cert:\CurrentUser\My\$env:WINDOWS_CERT_THUMBPRINT" -ErrorAction SilentlyContinue |
              Remove-Item -Force
          }
