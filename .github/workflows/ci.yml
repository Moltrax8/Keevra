name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  # Dependency advisories and machine-readable inventories (K-15). Runs on
  # Linux so SBOM generation and the advisory tooling stay fast and headless.
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # RustSec advisory database. Fails the build on a known vulnerability in
      # the locked Cargo graph.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-audit

      - name: Rust advisory audit
        run: cargo audit --file src-tauri/Cargo.lock

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - name: npm SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx > keevra-npm-sbom.cdx.json

      - name: Rust SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: src-tauri
          format: cyclonedx-json
          artifact-name: keevra-rust-sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keevra-npm-sbom
          path: keevra-npm-sbom.cdx.json
          if-no-files-found: error
